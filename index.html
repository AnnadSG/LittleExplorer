<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pequeno Explorador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, calm — same family as NeuroPlay / Banco de leitura
   IDEA: an explorer's passport — continents are themes, each country level earns a flag stamp
   PICTURE: real country maps of each continent; the learn card and the question card
   COLOUR and TYPE: NeuroPlay teal / orange / purple / coral on mint; Nunito
   LAYOUT: one column, big tap targets, stacks on phones */
:root{
  --teal:#1f7a78;--teal-d:#155e5c;--orange:#e8963a;--orange-d:#b8701f;--purple:#7a68b3;--purple-d:#5b4b93;--coral:#d9626b;
  --mint:#e7f3f1;--mint2:#d3ebe7;--ink:#1f2d3d;--muted:#5d6b7a;--line:#c9d6dd;--bg:#f7fbfa;--card:#fff;--ok:#2e9e6a;--r:18px;
  --sea:#d6ecf5;--land:#ffffff;--ctx:#e6ebee;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header.top{background:var(--mint);border-bottom:1px solid var(--mint2)}
header.top .wrap{display:flex;align-items:center;gap:8px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--teal-d)}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.spacer{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--mint2);font-weight:800;font-size:15px;min-height:40px}
.pill:hover{background:#f2faf8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{padding:9px 14px;font-weight:800;font-size:15px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--mint);color:var(--teal-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:900;font-size:18px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d);transition:transform .08s;min-height:48px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d);border:2px solid var(--mint2);box-shadow:0 3px 0 var(--mint2)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.btn.purple{background:var(--purple);box-shadow:0 3px 0 var(--purple-d)}
.btn.coral{background:var(--coral);box-shadow:0 3px 0 #a9434b}
.btn.small{padding:9px 14px;font-size:15px;border-radius:12px;min-height:42px}
.btn[disabled]{opacity:.45;pointer-events:none}
.eyebrow{font-size:13px;font-weight:900;color:var(--teal)}
h1{font-size:30px;margin:4px 0 6px;font-weight:900;line-height:1.1;text-wrap:balance}
h2{font-size:22px;margin:0 0 8px;font-weight:900}
h3{font-size:18px;margin:0 0 6px;font-weight:900}
p{line-height:1.5}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:16px 0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted);font-weight:700}
/* hero */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--mint);z-index:0}
.hero>*{position:relative;z-index:1}
.big-avatar{width:110px;height:110px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:64px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px var(--mint2)}
.today{flex:1;min-width:240px}
.ybar{height:14px;border-radius:999px;background:var(--mint);overflow:hidden;margin:10px 0 4px;max-width:380px}
.ybar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2fa39f);border-radius:999px}
.hl{font-weight:900;color:var(--orange-d)}
/* world map */
.worldbox{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px;margin-top:18px}
.worldbox svg{width:100%;height:auto;display:block}
.wc{cursor:pointer;transition:filter .15s}.wc:hover,.wc:focus{filter:brightness(1.08) drop-shadow(0 0 4px rgba(31,122,120,.5));outline:none}
.contchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.contchips button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:900;font-size:15px;min-height:42px;border:2px solid transparent;background:var(--mint)}
.contchips button.on{border-color:var(--teal);background:#fff}
/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;margin-top:14px}
.theme{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.theme.current{border-color:var(--teal);box-shadow:0 0 0 3px var(--mint2)}
.theme.complete{background:#f6fbf9}
.thead{display:flex;align-items:center;gap:10px}
.ticon{width:44px;height:44px;border-radius:14px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tname{font-weight:900;font-size:17px;line-height:1.2}
.tsub{font-size:13px;color:var(--muted);font-weight:700}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--mint);font-size:20px;margin-left:auto;flex:none}
.lvls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sbtn{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--muted);background:#fff;position:relative;overflow:visible}
.sbtn.done{border:2px solid var(--teal);background:var(--mint)}
.sbtn.done img{width:30px}
.sbtn.next{border:3px solid var(--orange);color:var(--orange-d);animation:pulse 1.6s infinite}
.sbtn.rv{border-color:#d8cfee;background:#f6f2fd;color:var(--purple-d)}.sbtn.rv.done{border:2px solid var(--purple);background:#efeafb;font-size:22px}
.sbtn.wd{border-color:#f3dcb8;background:#fff8ee;font-size:20px}.sbtn.wd.done{border:2px solid var(--orange)}
.sbtn .st3{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--orange);letter-spacing:-1px;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,150,58,.45)}50%{box-shadow:0 0 0 7px rgba(232,150,58,0)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
/* maps */
.mapwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mapwrap svg{width:100%;height:auto;display:block}
svg .ctx{fill:var(--ctx);stroke:#fff;stroke-width:.8}
svg .ct{fill:var(--land);stroke:#9fb3bd;stroke-width:.8;transition:fill .2s}
svg .ct.lrn{fill:#bfe3df}
svg .ct.hl{fill:var(--orange);stroke:#8a4f12;stroke-width:1.2}
svg .ct.ok{fill:var(--ok)}svg .ct.no{fill:var(--coral)}
svg .mk{fill:#fff;stroke:var(--teal-d);stroke-width:2}
svg .mk.lrn{fill:#bfe3df}svg .mk.hl{fill:var(--orange);stroke:#8a4f12}svg .mk.ok{fill:var(--ok)}svg .mk.no{fill:var(--coral)}
svg.tap .ct,svg.tap .mk{cursor:pointer}
svg.tap .ct:hover{fill:#fff1dc}svg.tap .mk:hover{fill:#fff1dc}
svg .ring{fill:none;stroke:var(--orange);stroke-width:4;animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.zoombar{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:22px;font-weight:900}
/* play */
.sess-head{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.prog{display:flex;gap:6px;margin-top:12px}
.prog i{flex:1;height:10px;border-radius:999px;background:var(--mint2)}
.prog i.ok{background:var(--ok)}.prog i.meh{background:var(--orange)}.prog i.cur{background:var(--teal)}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}
.instr{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--teal-d);background:var(--mint);border-radius:14px;padding:10px 12px}
.say{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--teal-d);padding:6px 10px;border-radius:10px;background:#fff;font-size:15px;flex:none;min-height:40px;min-width:40px;border:1px solid var(--mint2)}
.prompt{font-size:30px;font-weight:900;line-height:1.3;margin:20px 0 16px;text-align:center;text-wrap:balance;cursor:pointer}
.prompt .nm{color:var(--orange-d)}
.qflag{display:block;width:min(260px,70%);margin:0 auto 16px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.qemo{font-size:90px;text-align:center;line-height:1.1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:640px;margin:0 auto}
.opt{padding:14px 12px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:22px;box-shadow:0 3px 0 var(--line);min-height:62px;line-height:1.25;display:flex;align-items:center;justify-content:center;gap:10px}
.opt img{width:min(150px,100%)}
.opt .mf{width:40px;flex:none}
.optw{position:relative;display:flex}.optw .opt{flex:1;padding-right:44px}
.optw .osay{position:absolute;top:6px;right:6px;min-height:34px;min-width:34px;padding:4px 6px;font-size:14px;z-index:2}
.opt.speaking,.tfbtns .btn.speaking{outline:4px solid var(--orange);outline-offset:3px;transform:scale(1.04);box-shadow:0 0 0 8px rgba(232,150,58,.25);transition:transform .15s}
.opt:hover{border-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:#e8f7ef;color:#1d6b46;box-shadow:0 3px 0 #9fd6b8}
.opt.no{border-color:var(--orange);background:#fff6ea;color:#a5621a;opacity:.7}
.opt[disabled]{pointer-events:none}
.wobble{animation:wob .35s}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{display:none;align-items:center;gap:12px;border-radius:16px;padding:12px 16px;font-weight:900;font-size:19px;margin-top:16px;flex-wrap:wrap}
.feedback.show{display:flex}
.feedback.good{background:#e8f7ef;border:1px solid #bfe6d0;color:#1d6b46}
.feedback.try{background:#fff6ea;border:1px solid #f3dcb8;color:#a5621a}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto}
.tfbtns .btn{font-size:22px;padding:18px}
.tfcard{font-size:26px;font-weight:900;text-align:center;padding:24px 16px;border-radius:20px;background:#fffdf7;border:1px solid #f0e3c6;margin:16px 0;line-height:1.35;text-wrap:balance;cursor:pointer}
/* learn card */
.learn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start;margin-top:14px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.lcard .bigflag{width:min(240px,80%);margin:0 auto 6px;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.cname{font-size:34px;font-weight:900;line-height:1.1;margin:6px 0 10px;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;cursor:pointer;text-wrap:balance}
.factrow{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:14px;padding:10px 12px;margin-top:10px;text-align:left;font-weight:800;cursor:pointer}
.factrow .lb{font-size:13px;color:var(--teal);display:block}
.factrow .v{font-size:20px;color:var(--ink)}
.fact{background:#fffdf7;border:1px solid #f0e3c6;border-radius:16px;padding:14px 16px;text-align:left;font-size:18px;line-height:1.5;margin-top:10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--mint2);font-weight:800;font-size:14px;min-height:36px}
.chip img{width:26px}
.ldots{display:flex;gap:6px;justify-content:center;margin:4px 0 8px}
.lnav{position:sticky;bottom:0;z-index:5;background:rgba(247,251,250,.97);border-top:1px solid var(--mint2);padding:8px 0 12px;margin-top:14px}
.ldots i{width:12px;height:12px;border-radius:50%;background:var(--mint2)}.ldots i.on{background:var(--orange)}.ldots i.seen{background:var(--teal)}
/* end */
.finish{text-align:center;overflow:hidden}
.stars{font-size:44px;letter-spacing:6px;color:#f0b429}.stars .off{color:#e2e8ec}
.stamps{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.stamp{width:96px;height:96px;border-radius:50%;border:4px dashed var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8ee;transform:rotate(-8deg);animation:stampin .5s both}
.stamp img{width:54px}.stamp b{font-size:11px;line-height:1.1;max-width:80px;text-align:center}
@keyframes stampin{0%{transform:scale(1.6) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.bigsticker{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:84px;background:radial-gradient(circle at 35% 30%,#fff9da,#ffe08a);border:5px solid #d4a514;animation:pop .6s}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1)}}
/* review games */
.sky{position:relative;height:380px;border-radius:20px;background:linear-gradient(#dff1f7,#f4fbfd);overflow:hidden;border:1px solid var(--line)}
.balloon{position:absolute;bottom:-10px;display:flex;flex-direction:column;align-items:center;animation:rise 3.6s ease-in-out infinite alternate}
.balloon b{display:flex;align-items:center;justify-content:center;width:112px;max-width:100%;height:128px;border-radius:50% 50% 48% 48%;padding:12px;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08)}
.balloon b img{width:100%}
.balloon i{width:2px;height:50px;background:#9fb0c4}
.balloon.pop{animation:popb .35s forwards}
.balloon.shake b{animation:wob .35s}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-150px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:600px;margin:14px auto 0}
.mcard{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:repeating-linear-gradient(45deg,#e7f3f1,#e7f3f1 10px,#d3ebe7 10px,#d3ebe7 20px);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;line-height:1.15;word-break:break-word}
.mcard img{width:90%}
.mcard.up{background:#fff;border-color:var(--teal)}.mcard.up.b{border-color:var(--orange);background:#fff8ee}
.mcard.done{background:#e8f7ef;border-color:var(--ok);opacity:.8}
.mcard:not(.up)>*{visibility:hidden}
.gamechip{display:inline-flex;align-items:center;gap:6px;background:#efeafb;color:var(--purple-d);border-radius:999px;padding:6px 12px;font-weight:900}
.theme.rev{background:linear-gradient(135deg,#f1edfb,#fff7ec);border-color:#d8cfee}
/* passport */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;color:#c3ced4;font-weight:900;background:#fff;padding:6px}
.slot img{width:62%}.slot b{font-size:10px;color:var(--ink);line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.have{border:3px solid var(--orange);background:#fff8ee}
.slot.gold{border:3px solid #d4a514;background:radial-gradient(circle at 35% 30%,#fff9da,#ffe08a)}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fff}
.badge .m{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--mint)}
.badge.off{opacity:.5;filter:grayscale(1)}
/* profiles */
.kids{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;width:160px;padding:18px 10px;border-radius:20px;background:#fff;border:2px solid var(--line);transition:transform .1s}
.kid:hover{transform:translateY(-2px);border-color:var(--teal)}
.kid.add{border-style:dashed;color:var(--teal-d);justify-content:center}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900}
.kname{font-weight:900;font-size:19px}.kcount{font-size:13px;color:var(--orange-d);font-weight:800}
.animals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.animals button{font-size:28px;padding:6px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:48px}
.animals button.on{border:3px solid var(--orange);background:#fff8ee}
input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
label.f{display:block;font-weight:900;margin:14px 0 6px}
/* grown-ups */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:var(--mint);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:28px;font-weight:900;color:var(--teal-d);line-height:1.1}
.stat span{font-size:14px;font-weight:800;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid #e3eaee;text-align:left;vertical-align:middle}
table.t th{font-size:13px;color:var(--muted)}table.t td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--mint);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px}.bar i.mid{background:var(--orange)}.bar i.low{background:var(--coral)}
.kidrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.grownup{background:#fff8ee;border:1px solid #f3dcb8;border-radius:14px;padding:12px 14px;font-size:15px;margin-top:14px;line-height:1.5}
.grownup b{color:#a5621a}
.gu ul{padding-left:20px;line-height:1.6}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #edf2f4;font-weight:800;flex-wrap:wrap}
.toggle input{width:22px;height:22px;accent-color:var(--teal)}
textarea.txt{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.scroll{overflow-x:auto}
/* modal & misc */
.modal-bg{position:fixed;inset:0;background:rgba(20,40,50,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

let SEQ=0;

function say1(txt,el,id){return new Promise(res=>{
  const rate=S.settings.rate||0.9,code=lang==='pt'?'pt-PT':'en-GB';let fin=false;
  const on=()=>{if(id!==SEQ)return;clearHL();if(el)el.classList.add('speaking')};
  const off=()=>{if(fin)return;fin=true;if(el)el.classList.remove('speaking');res()};
  const guard=setTimeout(off,Math.max(1500,txt.length*110/rate));const done=()=>{clearTimeout(guard);off()};

  const z=f=>{const cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2;let w=Math.min(full[2],Math.max(full[2]/6,vb[2]*f)),h=w*full[3]/full[2];vb=[Math.max(0,Math.min(full[2]-w,cx-w/2)),Math.max(0,Math.min(full[3]-h,cy-h/2)),w,h];set()};

  <div class="grownup"><b>Sobre os dados:</b> 195 países (193 membros da ONU, mais o Vaticano e a Palestina, observadores). As bandeiras vêm do livro “Flags of the World” (ilustrações estilizadas). Os mapas são simplificados a partir do Natural Earth e não resolvem disputas de fronteiras. As capitais seguem fontes de referência; nos casos de Israel e da Palestina, a capital é disputada e não é perguntada. Algumas curiosidades foram escritas à mão e outras são geradas a partir dos dados (vizinhos, costa, tamanho). Confirme detalhes em fontes atuais antes de os ensinar.</div></div>`
  :`<div class="card"><h2>How to use Little Explorer</h2><ul>
  <li><b>Learn first, then test:</b> each level shows 5 countries one at a time (flag, name, capital, where it is on the map and a fun fact). Only then come the questions about those countries.</li>
  <li><b>Voice:</b> tapping any name, capital, fact or question reads it aloud. Automatic reading can be switched on or off in settings.</li>
  <li><b>Review games:</b> every 3 levels there is a review (balloons, memory, country hunt on the map, true or false) that starts with the countries the child got wrong.</li>
  <li><b>Free exploring:</b> each continent's 🔍 button opens the full map with zoom. Tapping a country shows its flag, capital and a fun fact.</li>
  <li><b>Rewards:</b> each level stamps flags in the passport; reviews give gold stickers; coins buy souvenirs; badges mark milestones.</li>
